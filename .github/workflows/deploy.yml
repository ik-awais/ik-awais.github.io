name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and validate Hugo site
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production
      HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5'
          extended: true

      - name: Build production site
        run: >-
          hugo
          --gc
          --minify
          --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Verify generated site and critical assets
        run: |
          set -euo pipefail

          required_files=(
            public/index.html
            public/404.html
            public/robots.txt
            public/sitemap.xml
            public/search-index.json
            public/favicon.ico
            public/favicon-16x16.png
            public/favicon-32x32.png
            public/favicon-512.png
            public/apple-touch-icon.png
            public/images/branding/muhammad-awais.png
            public/js/main.js
            public/js/pdf-export.js
            public/js/vendor/jspdf.umd.min.js
            public/projects/index.html
            public/blog/index.html
            public/articles/index.html
            public/publications/index.html
            public/contact/index.html
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Required build output missing or empty: $file" >&2
              exit 1
            fi
          done

          if ! find public/css -maxdepth 1 -type f -name 'main.min.*.css' -print -quit | grep -q .; then
            echo "Fingerprint/minified main CSS output was not found." >&2
            exit 1
          fi

          echo "Verified ${#required_files[@]} required output files and the fingerprinted CSS bundle."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./public

  deploy:
    name: Deploy GitHub Pages artifact
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
