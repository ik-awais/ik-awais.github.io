<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <nav id="navbar">
    <div style="display:flex;align-items:center">
      <a href="/" class="nav-logo">MA<span class="dot">.</span></a>
      <a href="https://aigenmat.com" target="_blank" rel="noopener" class="nav-logo-badge">· AI GenMat ↗</a>
    </div>
    <div class="nav-links">
      <a href="/projects/">Projects</a>
      <a href="/blog/">Blog</a>
      <a href="/#contact">Contact</a>
      <a href="{{ site.Params.github }}" target="_blank" rel="noopener">GitHub ↗</a>
      <a href="https://www.linkedin.com/in/muhammad-awais-ai-engineer/" target="_blank" rel="noopener" class="cta-btn">LinkedIn</a>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle colour theme">
        <span class="icon-moon" aria-hidden="true">☽</span>
        <span class="icon-sun" aria-hidden="true">☀</span>
      </button>
      <a href="https://www.upwork.com/freelancers/~018a2d0e2f88ac4838" target="_blank" rel="noopener" class="cta-btn cta-btn-primary">Hire Me</a>
    </div>
  </nav>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer>
    <p class="footer-left">© {{ now.Year }} Muhammad Awais · <a href="https://aigenmat.com" target="_blank" rel="noopener">AI GenMat ↗</a></p>
    <div class="footer-right">
      <a href="{{ site.Params.github }}" target="_blank" rel="noopener">GitHub</a>
      <a href="{{ site.Params.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
      <a href="mailto:{{ site.Params.email }}">Email</a>
      <a href="https://aigenmat.com" target="_blank" rel="noopener">aigenmat.com</a>
    </div>
  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
