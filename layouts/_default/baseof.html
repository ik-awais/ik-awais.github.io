<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <nav id="navbar">
    <a href="/" class="nav-logo">MA<span>.</span></a>
    <div class="nav-links">
      <a href="/projects/">Projects</a>
      <a href="/blog/">Blog</a>
      <a href="/#contact">Contact</a>
      <a href="{{ site.Params.github }}" target="_blank">GitHub ↗</a>
      <a href="https://www.linkedin.com/in/muhammad-awais-ai-engineer/" target="_blank" class="cta-btn">LinkedIn</a>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <span class="icon-moon">☽</span>
        <span class="icon-sun">☀</span>
      </button>
      <a href="https://www.upwork.com/freelancers/~018a2d0e2f88ac4838" target="_blank" class="cta-btn">Hire Me</a>
    </div>
  </nav>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer>
    <p>© {{ now.Year }} Muhammad Awais</p>
    <div class="footer-right">
      <a href="{{ site.Params.github }}" target="_blank">GitHub</a>
      <a href="{{ site.Params.linkedin }}" target="_blank">LinkedIn</a>
      <a href="mailto:{{ site.Params.email }}">Email</a>
    </div>
  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
