{{ define "main" }}
<section class="list-section">

  <div class="list-header reveal">
    <p class="hero-label">
      AI Engineer &middot; Software Engineering Student
    </p>

    <h1 class="section-title">About <span class="accent">Me.</span></h1>

    {{ with .Params.summary }}
    <p class="contact-desc">{{ . }}</p>
    {{ end }}
  </div>

  <article class="single-body">
    {{ .Content }}
  </article>

  <div class="list-header reveal" style="margin-top:64px">
    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <a href="/contact/" class="btn-primary">Hire Me</a>
      <a href="/contact/" class="btn-ghost">Book a Call</a>
    </div>
  </div>

</section>
{{ end }}
