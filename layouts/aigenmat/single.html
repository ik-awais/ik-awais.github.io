{{ define "main" }}
<section class="list-section">

  <div class="list-header reveal">
    <p class="hero-label">
      Professional Experience /
      <a href="https://aigenmat.com" target="_blank" rel="noopener noreferrer">
        AI GenMat &#8599;
      </a>
    </p>

    <h1 class="section-title">AI <span class="accent">GenMat.</span></h1>

    {{ with .Params.summary }}

  <article class="single-body">

  <div class="list-header reveal" style="margin-top:64px">
